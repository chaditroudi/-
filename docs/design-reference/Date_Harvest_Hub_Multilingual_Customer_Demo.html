function alerts(){return welcome(txt('alertsTitle'),txt('alertsSub'))+`<div class="alerts-list"><div class="alert-line"><div><span class="tag warn">⚠ ${esc(txt('priority'))}</span><strong>${esc(txt('alertOne'))}</strong><small>${esc(txt('alertOneSub'))} · LOT-0241</small></div><button class="mini-action" data-action="qc">${esc(txt('openQC'))}</button></div><div class="alert-line"><div><span class="tag error">⚙ ${esc(txt('priority'))}</span><strong>${esc(txt('alertTwo'))}</strong><small>${esc(txt('alertTwoSub'))}</small></div><button class="mini-action" data-action="maintenance">${esc(txt('openMaintenance'))}</button></div></div>`;}
const managerMetrics=(isOwner)=>isOwner?[['1,180','kpiInput','kg'],['880','kpiOutput','kg'],['80','kpiLoss','kg']]:[['7','kpiActive',''],['2','kpiWaiting',''],['18','kpiDone','']];
function managementHome(){const isOwner=state.profile==='owner';const metrics=managerMetrics(isOwner);const title=isOwner?'ownerGreeting':'superGreeting';return welcome(txt(title),txt(isOwner?'ownerIntro':'superIntro'))+`<div class="split-cards">${metrics.map(([value,label,suffix])=>`<div class="metric-card"><small>${esc(txt(label))}</small><b>${esc(value)}${suffix?' <span class="caption">'+suffix+'</span>':''}</b><span>${esc(txt('safeBadge'))}</span></div>`).join('')}</div><div class="dashboard-grid"><section class="panel"><h3>${esc(txt(isOwner?'yield':'floorStatus'))}</h3>${isOwner?[[1180,'source'],[1145,'cleanOutput'],[900,'sorted'],[880,'finalProduct']].map(([val,key])=>`<div class="barline"><span class="barname">${esc(txt(key))}</span><div class="track"><div class="fill" style="width:${val/1180*100}%"></div></div><b class="barvalue">${fmt(val)} kg</b></div>`).join(''):`<div class="journey-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${['reception','qc','production','packaging'].map(id=>`<button class="journey-card" data-station="${id}"><div><strong>${esc(txt('name.'+id))}</strong><small>${esc(txt('journeyBtn'))}</small></div><span class="big-icon">${st(id).icon}</span></button>`).join('')}</div>`}<p class="caption note-spacing">${esc(txt('managerSummary'))}</p></section><section class="panel"><h3>${esc(txt('priority'))}</h3><div class="priority-line"><div><div class="priority-title">⚠ ${esc(txt('alertOne'))}</div><small>LOT-0241</small></div><button class="mini-action" data-action="qc">${esc(txt('openQC'))}</button></div><div class="priority-line"><div><div class="priority-title">⚙ ${esc(txt('alertTwo'))}</div><small>LINE-02</small></div><button class="mini-action" data-action="maintenance">${esc(txt('openMaintenance'))}</button></div><div class="priority-line"><div><div class="priority-title">${esc(txt('journeyTitle'))}</div><small>LOT-0241</small></div><button class="mini-action" data-view="journey">${esc(txt('navTrace'))}</button></div></section></div>`;}
function render(){document.title='Date Harvest Hub | '+txt(state.profile==='worker'?'workers':state.profile==='owner'?'owner':'supervisor');$('#brandTag').textContent=txt('tagline');$('#languageCaption').textContent=txt('language');$('#languageSelect').value=state.lang;$('#topDemo').textContent=txt('demo');$('#demoNote').textContent=txt('safeBadge');$('#resetButton').textContent='↺ '+txt('reset');$('#footer').textContent=txt('noBackend');renderProfiles();renderStationSelector();renderNav();let view=state.view;let html=view==='flow'?workflow():view==='done'?completed():view==='tasks'?taskScreen():view==='journey'?journey():view==='scan'?scanner():view==='alerts'?alerts():state.profile==='worker'?homeWorker():managementHome();$('#scene').innerHTML=html;if(view==='flow')refreshLiveFact();}
function updateFieldValues(){const f=currentForm();document.querySelectorAll('[data-field]').forEach(el=>{f[el.dataset.field]=el.value;});}
function refreshLiveFact(){let current=$('#liveValue');if(!current)return;const replacement=contextualFact();const tpl=document.createElement('div');tpl.innerHTML=replacement;const newEl=tpl.querySelector('#liveValue');if(newEl)current.textContent=newEl.textContent;}
function showError(key){const el=$('#flowError');if(el){el.style.display='block';el.textContent='⚠ '+txt(key);el.scrollIntoView({block:'nearest',behavior:'smooth'});}}
function validateCurrent(){updateFieldValues();const f=currentForm(),r=role(),s=r.steps[state.step];if(!s)return true;for(const item of s){const [key,kind]=item;let val=f[key];if(val===undefined||val===null||String(val).trim()==='')return showError('fieldsRequired'),false;if(kind==='number'&&(!Number.isFinite(Number(val))||Number(val)<0))return showError('invalidNum'),false;}
if(r.id==='reception'&&state.step===1&&Number(f.gross)<=Number(f.tare))return showError('grossError'),false;
if(r.id==='cleaning'&&state.step===1&&Number(f.after)>Number(f.before))return showError('balanceError'),false;
if(r.id==='sorting'&&state.step===2&&Math.abs(Number(f.gradeA)+Number(f.gradeB)+Number(f.waste)-1145)>.001)return showError('balanceError'),false;
if(r.id==='production'&&state.step===2&&Math.abs(Number(f.output)+Number(f.waste)-Number(f.input))>.001)return showError('balanceError'),false;
if(r.id==='pallet'&&state.step===1&&Number(f.cartons)*Number(f.perCarton)!==880)return showError('balanceError'),false;
if(r.id==='packaging'&&state.step===2&&Number(f.count)*Number({one:1,two:2,five:5}[f.pack])>880)return showError('balanceError'),false;
if(r.id==='shipping'&&state.step===1&&Number(f.quantity)>880)return showError('balanceError'),false;
if(r.id==='export'&&state.step===1&&f.docs==='docsPending')return showError('docsIncomplete'),false;
return true;}
document.addEventListener('click',e=>{const profile=e.target.closest('[data-profile]');if(profile){changeProfile(profile.dataset.profile);return;}const station=e.target.closest('[data-station]');if(station){changeStation(station.dataset.station);return;}const nav=e.target.closest('[data-view]');if(nav){navigate(nav.dataset.view);return;}const choice=e.target.closest('[data-choice]');if(choice){updateFieldValues();currentForm()[choice.dataset.choice]=choice.dataset.value;render();return;}const action=e.target.closest('[data-action]');if(!action)return;const act=action.dataset.action;
if(act==='start'){state.view='flow';state.step=0;render();}
else if(act==='next'){if(validateCurrent()){state.step++;render();}}
else if(act==='back'){updateFieldValues();state.step=Math.max(0,state.step-1);render();}
else if(act==='exit'||act==='home'){navigate('home');}
else if(act==='finish'){state.completed.add(state.station);state.view='done';render();}
else if(act==='retry'){state.step=0;state.view='flow';render();}
else if(act==='handoff'){if(role().next)changeStation(role().next);}
else if(act==='scan'){state.scanCode=$('#scannerInput')?.value.trim()||'';state.scanResult=['LOT-0241','RC-2026-0241','QC-0411','PF-0241','PAL-0320','SH-0091'].includes(state.scanCode.toUpperCase());render();}
else if(act==='qc'||act==='maintenance'){changeStation(act);}
});
document.addEventListener('input',e=>{if(e.target.matches('[data-field]')){currentForm()[e.target.dataset.field]=e.target.value;refreshLiveFact();}if(e.target.id==='scannerInput')state.scanCode=e.target.value;});
document.addEventListener('change',e=>{if(e.target.matches('[data-field]')){currentForm()[e.target.dataset.field]=e.target.value;refreshLiveFact();}});
$('#languageSelect').addEventListener('change',e=>setLanguage(e.target.value));
$('#resetButton').addEventListener('click',resetDemo);
render();
</script>
</body></html>
