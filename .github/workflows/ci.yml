name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, gh-pages]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check server
        run: npm run typecheck:server

      # 218 known errors; becomes required when Phase 5 clears them.
      - name: Type-check client
        run: npm run typecheck:client
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_BUILD_TARGET: test
          VITE_API_URL: /api
