<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Date Harvest Hub</title>
    <meta name="description" content="MES + Connect pour usines de dattes — réception, traçabilité, qualité, conditionnement et export." />
    <meta name="application-name" content="Date Harvest Hub" />
    <meta name="author" content="Date Harvest Hub" />

    <!-- Theme & status bar colour -->
    <meta name="theme-color" content="#0E5A4B" />
    <meta name="msapplication-TileColor" content="#0E5A4B" />

    <!-- iOS standalone PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Date Harvest Hub" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Date Harvest Hub" />
    <meta property="og:description" content="MES + Connect pour toute usine de dattes — du quai à l’export." />
    <meta property="og:image" content="/pwa-512x512.png" />

    <!-- Prevent iOS phone/email linkification -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Arabic script fallback for RTL workers (Barlow remains for lot codes). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
